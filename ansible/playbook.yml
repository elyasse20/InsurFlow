---
- name: Provision & Configure InsurFlow Azure Ubuntu 22.04 LTS VM
  hosts: azure_servers
  become: true
  gather_facts: true

  vars:
    app_user: "adminuser"
    app_directory: "/home/{{ app_user }}/InsurFlow"
    repo_url: "https://github.com/elyasse20/InsurFlow.git"
    repo_branch: "main"
    firewall_ports:
      - { port: 22, proto: 'tcp', comment: 'SSH Access' }
      - { port: 80, proto: 'tcp', comment: 'HTTP Web Traffic' }
      - { port: 443, proto: 'tcp', comment: 'HTTPS Secure Traffic' }
      - { port: 3000, proto: 'tcp', comment: 'InsurFlow Frontend Preview' }
      - { port: 8080, proto: 'tcp', comment: 'InsurFlow Backend API' }

  tasks:
    # =========================================================================
    # 1. System Updates & Essentials
    # =========================================================================
    - name: Update apt repository cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all safe system packages
      ansible.builtin.apt:
        upgrade: safe

    - name: Install essential dependencies
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - ufw
          - git
          - software-properties-common
        state: present

    # =========================================================================
    # 2. Docker Official Engine Installation
    # =========================================================================
    - name: Ensure /etc/apt/keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
        force: false

    - name: Add Docker official APT repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker CE, CLI, Containerd and Docker Compose Plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure Docker and Containerd services are started and enabled on boot
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - docker
        - containerd

    # =========================================================================
    # 3. User & Permissions Configuration
    # =========================================================================
    - name: Add {{ app_user }} to docker group for rootless Docker access
      ansible.builtin.user:
        name: "{{ app_user }}"
        groups: docker
        append: yes

    # =========================================================================
    # 4. Firewall & Security Hardening (UFW)
    # =========================================================================
    - name: Set UFW default incoming policy to deny
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Set UFW default outgoing policy to allow
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Allow required incoming ports through UFW
      community.general.ufw:
        rule: allow
        port: "{{ item.port | string }}"
        proto: "{{ item.proto }}"
        comment: "{{ item.comment }}"
      loop: "{{ firewall_ports }}"

    - name: Enable UFW firewall safely
      community.general.ufw:
        state: enabled

    # =========================================================================
    # 5. Application Repository Synchronization
    # =========================================================================
    - name: Ensure application directory exists with proper permissions
      ansible.builtin.file:
        path: "{{ app_directory }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'

    - name: Clone or sync InsurFlow application repository from GitHub
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_directory }}"
        version: "{{ repo_branch }}"
        update: yes
        force: no
      become_user: "{{ app_user }}"
