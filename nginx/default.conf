# =============================================================================
# InsurFlow - Nginx Production Configuration with SSL (Let's Encrypt / Certbot)
# =============================================================================

# 1. HTTP Server Block (Port 80)
# Serves ACME challenge and permanently redirects all other traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name insurflow-app.duckdns.org 158.158.112.79;

    # Let's Encrypt ACME challenge endpoint
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://insurflow-app.duckdns.org$request_uri;
    }
}

# 2. HTTPS Server Block (Port 443)
# Secure reverse proxy for Frontend (Next.js) and Backend (Spring Boot)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name insurflow-app.duckdns.org;

    # Let's Encrypt SSL Certificates
    ssl_certificate /etc/letsencrypt/live/insurflow-app.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/insurflow-app.duckdns.org/privkey.pem;

    # Modern SSL Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Maximum file upload size (documents/attachments)
    client_max_body_size 25M;

    # ACME challenge renewal endpoint
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API Reverse Proxy Routing (Spring Boot Backend)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Frontend Reverse Proxy Routing (Next.js Application)
    location / {
        proxy_pass http://frontend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
