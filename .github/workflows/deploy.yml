name: DevSecOps CI/CD Pipeline - InsurFlow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ===========================================================================
  # 1. Code Quality & Automated Unit Tests (High Speed & Cached)
  # ===========================================================================
  quality-and-tests:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ── Backend: Java 21 + Maven Dependency Cache ──────────────────────────
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven Repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Run Backend Unit Tests & Compilation
        run: |
          cd backend
          mvn -B -DskipTests=false clean test

      # ── Frontend: Node.js 20 + npm Dependency Cache ────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci --prefer-offline || npm install

      - name: Run Frontend Linting (ESLint)
        run: |
          cd frontend
          npm run lint

      - name: Run Frontend TypeScript Typecheck
        run: |
          cd frontend
          npm run typecheck

  # ===========================================================================
  # 2. Optimized Trivy Security Scan (Lightweight & DB-Cached)
  # ===========================================================================
  security-scan:
    name: Trivy Security & Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Get Current Date for Trivy Cache
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache Trivy Vulnerability DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Initialize Security Report Placeholders
        run: |
          touch trivy-fs-report.txt
          touch trivy-fs-results.sarif

      # ── Fast Filesystem & Dependency Vulnerability Scan ────────────────────
      - name: Run Trivy Vulnerability & Secret Scan (Filesystem)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          output: 'trivy-fs-report.txt'

      - name: Generate Trivy SARIF Output
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      # ── Upload Scan Artifacts ─────────────────────────────────────────────
      - name: Upload Trivy Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-security-reports
          if-no-files-found: warn
          path: |
            trivy-fs-report.txt
            trivy-fs-results.sarif

  # ===========================================================================
  # 3. Gated Deployment to Azure VM
  # ===========================================================================
  deploy:
    name: Deploy to Azure VM
    needs: [quality-and-tests, security-scan]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 30m
          timeout: 60s
          script: |
            cd ~/InsurFlow
            git pull origin main
            sudo docker compose up -d --build
            sudo docker image prune -f