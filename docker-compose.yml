version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: insurflow_mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - insurflow_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insurflow_backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/assurance
      - JWT_SECRET=changeme_super_secret_key_at_least_32_chars_long
      - CORS_ORIGINS=http://localhost,http://158.158.112.79,http://localhost:3000,http://158.158.112.79:3000,https://insurflow-app.duckdns.org,http://insurflow-app.duckdns.org
      - UPLOADS_DIR=./uploads
      - ADMIN_EMAIL=admin@insurflow.com
      - ADMIN_PASSWORD=admin123
      - ADMIN_USERNAME=admin
    depends_on:
      - mongodb
    networks:
      - insurflow_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api
    container_name: insurflow_frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - BACKEND_INTERNAL_URL=http://backend:8080
    depends_on:
      - backend
    networks:
      - insurflow_net

  prometheus:
    image: prom/prometheus:latest
    container_name: insurflow_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - insurflow_net

  grafana:
    image: grafana/grafana:latest
    container_name: insurflow_grafana
    restart: unless-stopped
    environment:
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - insurflow_net

  nginx:
    image: nginx:alpine
    container_name: insurflow_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
      - grafana
    networks:
      - insurflow_net

  certbot:
    image: certbot/certbot:latest
    container_name: insurflow_certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - insurflow_net

volumes:
  mongo_data:
  prometheus_data:
  grafana_data:

networks:
  insurflow_net:
    driver: bridge
