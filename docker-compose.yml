version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: insurflow_mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - insurflow_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insurflow_backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/assurance
      - JWT_SECRET=changeme_super_secret_key_at_least_32_chars_long
      - CORS_ORIGINS=http://localhost,http://158.158.112.79,http://localhost:3000,http://158.158.112.79:3000
      - UPLOADS_DIR=./uploads
      - ADMIN_EMAIL=admin@insurflow.com
      - ADMIN_PASSWORD=admin123
      - ADMIN_USERNAME=admin
    depends_on:
      - mongodb
    networks:
      - insurflow_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api
    container_name: insurflow_frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - BACKEND_INTERNAL_URL=http://backend:8080
    depends_on:
      - backend
    networks:
      - insurflow_net

  nginx:
    image: nginx:alpine
    container_name: insurflow_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - insurflow_net

volumes:
  mongo_data:

networks:
  insurflow_net:
    driver: bridge

